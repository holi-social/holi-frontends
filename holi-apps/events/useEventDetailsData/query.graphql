query allEvents {
  appEvents_events(limit: 5, offset: 0, location: "Hamburg") {
    data {
      id
      title
      organisationName
      startDate
      endDate
      isRemote
      imageUrl
      eventDetails {
        description
        meetingLink
        externalLink
      }
      location {
        street
        streetNo
        zipCode
        city
      }
    }
  }
}

query listViewEvents {
  appEvents_events(limit: 5, offset: 0, location: "Hamburg") {
    data {
