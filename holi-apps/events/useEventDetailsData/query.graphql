query allEvents($limit: Int!, $offset: Int!, $location: String) {
  appEvents_events(limit: $limit, offset: $offset, location: $location) {
    totalResults
    data {
      id
      title
      organisationName
      startDate
      endDate
      isRemote
      imageUrl
      eventDetails {
        description
        meetingLink
        externalLink
      }
      location {
        street
        streetNo
        zipCode
        city
      }
    }
  }
}
