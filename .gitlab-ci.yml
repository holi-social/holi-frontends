# TODO add e2e test against review (aka development) build for mobile?

# caching strategy follows "Solution 1" taken from https://medium.com/disdj/speed-up-npm-yarn-install-in-gitlab-1434437f9857
# first job (lint_compile_test) warms the cache (read-write), subsequent jobs only read from it
# cache key corresponds to current branch name ($CI_COMMIT_REF_SLUG)
cache:
  key: $CI_COMMIT_REF_SLUG
  policy: pull
  untracked: true

default:
  before_script:
    - set -ex
    - env

stages:
  - 'lint_compile_test'
  - 'build_deploy'

lint_compile_test:
  stage: 'lint_compile_test'
  image: 'registry.gitlab.com/holisticfoundation/holi-docker/alpine-node-expo-eas'
  script:
    - yarn install
    - yarn turbo run lint
    - yarn turbo run test
  cache:
    key: $CI_COMMIT_REF_SLUG
    policy: pull-push
    paths:
      - 'node_modules'
      - 'apps/*/node_modules'
      - 'holi-apps/*/node_modules'
      - 'packages/*/node_modules'
      - 'core/node_modules'
      - 'e2e/*/node_modules'

mobile_review_publish:
  stage: 'build_deploy'
  needs: ['lint_compile_test']
  image: 'registry.gitlab.com/holisticfoundation/holi-docker/alpine-node-expo-eas'
  script:
    - cd apps/mobile
    - expo publish --release-channel $CI_ENVIRONMENT_SLUG
  environment:
    name: review/$CI_COMMIT_REF_SLUG
    url: https://expo.dev/@holistic-foundation/projectholi?serviceType=classic&distribution=expo-go&release-channel=$CI_ENVIRONMENT_SLUG
  except:
    - main
    - /^noenv\/.*/

mobile_staging_publish:
  stage: 'build_deploy'
  needs: ['lint_compile_test']
  image: 'registry.gitlab.com/holisticfoundation/holi-docker/alpine-node-expo-eas'
  script:
    - cd apps/mobile
    - expo publish --release-channel staging
  environment:
    name: staging
    url: https://expo.dev/@holistic-foundation/projectholi?serviceType=classic&distribution=expo-go&release-channel=staging
  only:
    - main

mobile_staging_build:
  stage: 'build_deploy'
  needs: ['lint_compile_test']
  image: 'registry.gitlab.com/holisticfoundation/holi-docker/alpine-node-expo-eas'
  script:
    - 'cd apps/mobile'
    - 'eas build --platform android --profile staging' # or eas build --platform all
    - 'export AAB_URL=$(eas build:list --gitCommitHash ${CI_COMMIT_SHA} --json --platform android --limit 1 2> /dev/null | jq -r ".[0].artifacts.buildUrl")' # extracts build URL from EAS
    - 'mkdir -p artifacts_staging && curl -o artifacts_staging/$(basename $AAB_URL) $AAB_URL'
  artifacts:
    paths:
      - artifacts_staging/
  only:
    - main

mobile_staging_e2e:
  stage: 'build_deploy'
  needs: ['mobile_staging_build']
  image: 'registry.gitlab.com/holisticfoundation/holi-docker/alpine-node-expo-eas'
  script:
    - cd apps/mobile
    - export EAS_AAB_URL=$(eas build:list --gitCommitHash ${CI_COMMIT_SHA} --json --platform android --limit 1 | jq -r ".[0].artifacts.buildUrl") # extracts build URL from EAS
    - export EAS_AAB_FILE=$(basename $EAS_AAB_URL)
    - curl -L -s -o ../../e2e/mobile-android/$EAS_AAB_FILE $EAS_AAB_URL # download .aab from EAS
    - cd ../../e2e/mobile-android
    - yarn install
    - export BROWSERSTACK_UPLOAD_RESPONSE=$(curl -s -u "${BROWSERSTACK_USERNAME}:${BROWSERSTACK_ACCESS_KEY}" -X POST "https://api-cloud.browserstack.com/app-automate/upload" -F "file=@${EAS_AAB_FILE}")
    - export BROWSERSTACK_APP_URL=$(echo "${BROWSERSTACK_UPLOAD_RESPONSE}" | jq -r '.app_url')
    - yarn run codeceptjs
  allow_failure: true
  only:
    - main

mobile_production_publish:
  stage: 'build_deploy'
  needs: ['mobile_staging_e2e']
  when: manual
  image: 'registry.gitlab.com/holisticfoundation/holi-docker/alpine-node-expo-eas'
  script:
    - cd apps/mobile
    - expo publish --release-channel production
  environment:
    name: production
    url: https://expo.dev/@holistic-foundation/projectholi?serviceType=classic&distribution=expo-go&release-channel=production
  only:
    - main

mobile_production_build:
  stage: 'build_deploy'
  needs: ['mobile_staging_e2e']
  when: manual
  image: 'registry.gitlab.com/holisticfoundation/holi-docker/alpine-node-expo-eas'
  script:
    - 'cd apps/mobile'
    - 'eas build --platform android --profile production' # or eas build --platform all
    - 'export AAB_URL=$(eas build:list --gitCommitHash ${CI_COMMIT_SHA} --json --platform android --limit 1 2> /dev/null | jq -r ".[0].artifacts.buildUrl")' # extracts build URL from EAS
    - 'mkdir -p artifacts_production && curl -o artifacts_production/$(basename $AAB_URL) $AAB_URL'
  artifacts:
    paths:
      - artifacts_production/
  only:
    - main

# disabled (hidden) (not implemented yet), only increases build times and uses up runner minutes
.mobile_production_submit:
  stage: 'build_deploy'
  needs: ['mobile_production_build']
  image: 'registry.gitlab.com/holisticfoundation/holi-docker/alpine-node-expo-eas'
  script:
    - echo 'submission to app store(s) goes here'
  only:
    - main

web_build:
  stage: 'build_deploy'
  needs: ['lint_compile_test']
  image: 'registry.gitlab.com/holisticfoundation/holi-docker/alpine-node-expo-eas'
  script:
    - yarn web:build
  artifacts:
    paths:
      - apps/web/.next

# TODO: this currently uses a manually created service account (not tf-managed) for playground-daniel project
web_build_docker:
  stage: 'build_deploy'
  needs: ['web_build']
  image: docker:20.10
  services:
    - docker:20.10-dind
  variables:
    GITLAB_IMAGE: $CI_REGISTRY_IMAGE/hrns
    # this could be fetched via terraform output ("gcr_location" in infra project), but then we would need an extra job for terraform
    GCR_IMAGE: eu.gcr.io/holi-shared/hrns
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - cat $GOOGLE_CLOUD_SERVICE_ACCOUNT | docker login -u _json_key --password-stdin https://eu.gcr.io
  script:
    - cd apps/web/
    - docker pull $GITLAB_IMAGE || true # Allows us to use --cache-from
    - docker build --cache-from $GITLAB_IMAGE -t $GITLAB_IMAGE:$CI_COMMIT_REF_SLUG -t $GCR_IMAGE:$CI_COMMIT_REF_SLUG .
    - docker push $GITLAB_IMAGE:$CI_COMMIT_REF_SLUG
    - docker push $GCR_IMAGE:$CI_COMMIT_REF_SLUG





# disabled (hidden) (not implemented yet), only increases build times and uses up runner minutes
.web_review_deploy:
  stage: 'build_deploy'
  needs: ['web_build_docker']
  image: 'hashicorp/terraform:light'
  environment:
    name: review/$CI_COMMIT_REF_SLUG
    on_stop: terraform_destroy_branch
    auto_stop_in: 1 week
  artifacts:
    paths:
      - "apps/web/terraform/scripts/crash.log" # optional, only available in case of a crash/panic
      - "apps/web/terraform/scripts/terraform-*.log" # separate log for every step/command
    name: "${CI_JOB_NAME}_${CI_JOB_ID}"
    when: on_failure
  before_script:
    - export GOOGLE_APPLICATION_CREDENTIALS=${GOOGLE_CLOUD_SERVICE_ACCOUNT}
  script:
    - apps/web/terraform/scripts/create-or-update-env.sh $CI_COMMIT_REF_SLUG
  except:
    - main
    - /^noenv\/.*/

