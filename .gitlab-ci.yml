variables:
  YARN_CACHE_FOLDER: '$CI_PROJECT_DIR/.yarn/cache'
  YARN_ENABLE_GLOBAL_CACHE: 'false'

.yarn-cache-rw:
  key:
    files:
      - yarn.lock
  paths:
    - .yarn/
  policy: pull-push

.yarn-cache-readonly:
  key:
    files:
      - yarn.lock
  paths:
    - .yarn/
  policy: pull

# rules templates
.rule_templates:
  not_on_git_tags:
    - if: '$CI_COMMIT_TAG'
      when: never
  skip_environment_for_web:
    - if: $CI_COMMIT_BRANCH =~ /^noenv\/.*|^noweb\/.*/
      when: never
  skip_environment_for_mobile:
    - if: $CI_COMMIT_BRANCH =~ /^noenv\/.*|^nomobile\/.*/
      when: never
  only_on_production_release:
    - !reference [.rule_templates, not_on_git_tags]
    - if: $CI_COMMIT_BRANCH =~ /^release\/.*/
      when: on_success
  manually_on_production_release:
    - !reference [.rule_templates, not_on_git_tags]
    - if: $CI_COMMIT_BRANCH =~ /^release\/.*/
      when: manual
  automatically_on_staging:
    - !reference [.rule_templates, not_on_git_tags]
    - if: $CI_COMMIT_BRANCH == "main"
      when: on_success
  manually_on_staging:
    - !reference [.rule_templates, not_on_git_tags]
    - if: $CI_COMMIT_BRANCH == "main"
      when: manual
  any_but_production_staging:
    - !reference [.rule_templates, not_on_git_tags]
    - if: $CI_COMMIT_BRANCH =~ /^release\/.*|^main$/
      when: never
  automatically_on_any_other:
    - if: $CI_COMMIT_BRANCH
      when: on_success
  manually_on_any_other:
    - if: $CI_COMMIT_BRANCH
      when: manual
  automatically_on_scheduled_e2e_test_run:
    - if: $CI_PIPELINE_SOURCE == "schedule" &&  $CI_RUN_E2E_TESTS == "true"
      when: on_success

default:
  before_script:
    - set -ex
    # env -0 | sort -z | tr '\0' '\n': Sort env output alphabetically, keeping multiline variables intact
    # egrep: Remove sensitive information from the output of env
    - env -0 | sort -z | tr '\0' '\n' | egrep -ve '^(DOCKER_AUTH_CONFIG|GOOGLE_APPLICATION_CREDENTIALS)=.*'
  tags:
    - 1cpu-4gb
  image: 'europe-north1-docker.pkg.dev/holi-shared/docker/holi-docker/node-expo-eas'

install_deps:
  stage: build
  image: 'europe-north1-docker.pkg.dev/holi-shared/docker/holi-docker/node-expo-eas'
  cache: !reference [.yarn-cache-rw]
  interruptible: true
  script:
    - corepack enable
    - yarn install --immutable
  rules:
    # Execute step if yarn.lock was changed or cache is missing
    # Inspired by https://gitlab.com/gitlab-org/gitlab/-/issues/244932#note_1727726890
    - if: $CI_COMMIT_BRANCH
      changes:
        - yarn.lock
    - exists:
        - .yarn
      when: never
    - if: $CI_COMMIT_BRANCH
      exists:
        - yarn.lock
      when: always

lint_compile_test:
  stage: build
  needs:
    - job: install_deps
      optional: true
  image: 'europe-north1-docker.pkg.dev/holi-shared/docker/holi-docker/node-expo-eas'
  cache: !reference [.yarn-cache-readonly]
  script:
    - corepack enable
    - yarn install --immutable --immutable-cache
    - yarn lint
    - yarn test
  interruptible: true
  tags:
    - 4cpu-16gb
  rules:
    - !reference [.rule_templates, not_on_git_tags]
    - !reference [.rule_templates, automatically_on_any_other]

# the web and mobile only pipeline steps are defined in separate files for better overview and separation of concerns
include:
  - '/.gitlab-ci-web.yml'
  - '/.gitlab-ci-mobile.yml'
