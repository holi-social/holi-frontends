# TODO speed up yarn dependency caching https://medium.com/disdj/speed-up-npm-yarn-install-in-gitlab-1434437f9857

# caching strategy follows "Solution 1" taken from https://medium.com/disdj/speed-up-npm-yarn-install-in-gitlab-1434437f9857
# first job (lint_compile_test) warms the cache (read-write), subsequent jobs only read from it, and only if they need the cache
# cache key corresponds to current branch name ($CI_COMMIT_REF_SLUG)

.pull_push_cache:
  key: $CI_COMMIT_REF_SLUG
  policy: pull-push
  paths:
    - './node_modules'
    - './*/node_modules'
    - './*/*/node_modules'
    - './apps/web/.next/cache/'

# rules templates
.rule_templates:
  not_on_git_tags:
    - if: '$CI_COMMIT_TAG'
      when: never
  skip_environment_for_web:
    - if: $CI_COMMIT_BRANCH =~ /^noenv\/.*|^noweb\/.*/
      when: never
  skip_environment_for_mobile:
    - if: $CI_COMMIT_BRANCH =~ /^noenv\/.*|^nomobile\/.*/
      when: never
  only_on_production_release:
    - !reference [.rule_templates, not_on_git_tags]
    - if: $CI_COMMIT_BRANCH =~ /^release\/.*/
      when: on_success
  manually_on_production_release:
    - !reference [.rule_templates, not_on_git_tags]
    - if: $CI_COMMIT_BRANCH =~ /^release\/.*/
      when: manual
  automatically_on_staging:
    - !reference [.rule_templates, not_on_git_tags]
    - if: $CI_COMMIT_BRANCH == "main"
      when: on_success
  manually_on_staging:
    - !reference [.rule_templates, not_on_git_tags]
    - if: $CI_COMMIT_BRANCH == "main"
      when: manual
  any_but_production_staging:
    - !reference [.rule_templates, not_on_git_tags]
    - if: $CI_COMMIT_BRANCH =~ /^release\/.*|^main$/
      when: never
  automatically_on_any_other:
    - if: $CI_COMMIT_BRANCH
      when: on_success
  manually_on_any_other:
    - if: $CI_COMMIT_BRANCH
      when: manual
  automatically_on_scheduled_e2e_test_run:
    - if: $CI_PIPELINE_SOURCE == "schedule" &&  $CI_RUN_E2E_TESTS == "true"
      when: on_success

default:
  before_script:
    - set -e
    # env -0 | sort -z | tr '\0' '\n': Sort env output alphabetically, keeping multiline variables intact
    # egrep: Remove sensitive information from the output of env
    #- env -0 | sort -z | tr '\0' '\n' | egrep -ve '^(DOCKER_AUTH_CONFIG|GOOGLE_APPLICATION_CREDENTIALS)=.*'
  tags:
    - 1cpu-4gb
  image: 'europe-north1-docker.pkg.dev/holi-shared/docker/holi-docker/node-expo-eas'
  cache: # pull only, with branch name as key name
    key: $CI_COMMIT_REF_SLUG
    policy: pull
    paths: !reference [.pull_push_cache, paths]

lint_compile_test:
  stage: build
  image: 'europe-north1-docker.pkg.dev/holi-shared/docker/holi-docker/node-expo-eas'
  script:
    - yarn install --immutable --check-cache
    - yarn lint
    - yarn test
  cache: !reference [.pull_push_cache]
  interruptible: true
  tags:
    - 4cpu-16gb
  rules:
    - !reference [.rule_templates, not_on_git_tags]
    - !reference [.rule_templates, automatically_on_any_other]

# the web and mobile only pipeline steps are defined in separate files for better overview and separation of concerns
include:
  - '/.gitlab-ci-web.yml'
  - '/.gitlab-ci-mobile.yml'
