# TODO speed up yarn dependency caching https://medium.com/disdj/speed-up-npm-yarn-install-in-gitlab-1434437f9857

# caching strategy follows "Solution 1" taken from https://medium.com/disdj/speed-up-npm-yarn-install-in-gitlab-1434437f9857
# first job (lint_compile_test) warms the cache (read-write), subsequent jobs only read from it, and only if they need the cache
# cache key corresponds to current branch name ($CI_COMMIT_REF_SLUG)
cache:
  key: $CI_COMMIT_REF_SLUG
  policy: pull
  untracked: true

default:
  before_script:
    - set -ex
    - env
  tags:
    - holi-small

debug:
  stage: build
  image: 'registry.gitlab.com/holisticfoundation/holi-docker/alpine-node-expo-eas'
  script:
    - whoami
    - ls -al ~
    - cat ~/pre_build
    - cat ~/pre_get_sources
    - cat ~/.docker/config.json

lint_compile_test:
  needs: ['debug']
  stage: build
  image: 'europe-north1-docker.pkg.dev/holi-shared/docker/alpine-node-expo-eas'
  script:
    - yarn install
    - yarn lint
    - yarn test
  cache:
    key: $CI_COMMIT_REF_SLUG
    policy: pull-push
    paths:
      - 'node_modules'
      - 'apps/*/node_modules'
      - 'holi-apps/*/node_modules'
      - 'packages/*/node_modules'
      - 'core/node_modules'
      - 'e2e/*/node_modules'
  interruptible: true
  tags:
    - holi-big

# the web and mobile only pipeline steps are defined in separate files for better overview and separation of concerns
include:
  - '/.gitlab-ci-web.yml'
  - '/.gitlab-ci-mobile.yml'
