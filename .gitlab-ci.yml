variables:
  YARN_CACHE_FOLDER: '$CI_PROJECT_DIR/.yarn/cache'
  YARN_ENABLE_GLOBAL_CACHE: 'false'

.yarn-cache-rw:
  key:
    files:
      - yarn.lock
  paths:
    - .yarn/
  policy: pull-push

.yarn-cache-readonly:
  key:
    files:
      - yarn.lock
  paths:
    - .yarn/
  policy: pull

.rule_templates:
  not_on_git_tags:
    - if: '$CI_COMMIT_TAG'
      when: never
  skip_environment_for_web:
    - if: $CI_COMMIT_BRANCH =~ /^noenv\/.*|^noweb\/.*/
      when: never
  skip_environment_for_mobile:
    - if: $CI_COMMIT_BRANCH =~ /^noenv\/.*|^nomobile\/.*/
      when: never
  only_on_production_release:
    - !reference [.rule_templates, not_on_git_tags]
    - if: $CI_COMMIT_BRANCH =~ /^release\/.*/
      when: on_success
  manually_on_production_release:
    - !reference [.rule_templates, not_on_git_tags]
    - if: $CI_COMMIT_BRANCH =~ /^release\/.*/
      when: manual
  automatically_on_staging:
    - !reference [.rule_templates, not_on_git_tags]
    - if: $CI_COMMIT_BRANCH == "main"
      when: on_success
  manually_on_staging:
    - !reference [.rule_templates, not_on_git_tags]
    - if: $CI_COMMIT_BRANCH == "main"
      when: manual
  any_but_production_staging:
    - !reference [.rule_templates, not_on_git_tags]
    - if: $CI_COMMIT_BRANCH =~ /^release\/.*|^main$/
      when: never
  automatically_on_any_other:
    - if: $CI_COMMIT_BRANCH
      when: on_success
  manually_on_any_other:
    - if: $CI_COMMIT_BRANCH
      when: manual
  automatically_on_e2e_nightly_pipeline:
    - if: $CI_PIPELINE_NAME == "E2E Nightly"

default:
  before_script:
    - set -ex
    # env -0 | sort -z | tr '\0' '\n': Sort env output alphabetically, keeping multiline variables intact
    # egrep: Remove sensitive information from the output of env
    - env -0 | sort -z | tr '\0' '\n' | egrep -ve '^(DOCKER_AUTH_CONFIG|GOOGLE_APPLICATION_CREDENTIALS)=.*'
  tags:
    - 1cpu-4gb
  image: 'europe-north1-docker.pkg.dev/holi-shared/docker/holi-docker/node-expo-eas'

install_deps:
  stage: build
  image: 'europe-north1-docker.pkg.dev/holi-shared/docker/holi-docker/node-expo-eas'
  cache: !reference [.yarn-cache-rw]
  interruptible: true
  script:
    - corepack enable
    - yarn install --immutable
  rules:
    - if: $CI_COMMIT_BRANCH
      changes:
        - yarn.lock
        - .gitlab-ci.yml

lint_compile_test:
  stage: build
  needs:
    - job: install_deps
      optional: true
  image: 'europe-north1-docker.pkg.dev/holi-shared/docker/holi-docker/node-expo-eas'
  cache: !reference [.yarn-cache-rw]
  script:
    - corepack enable
    # If CI Cache is empty because install_deps did not run, install filling the cache, otherwise install from the immutable cache
    # install_deps does not run on long living branches, and it might not run on pipeline failures on the first build of a branch
    - '[ ! -d ".yarn/cache" ] && yarn install --immutable || yarn install --immutable --immutable-cache'
    - yarn format:check
    - yarn lint
    - yarn test
  interruptible: true
  tags:
    - 4cpu-16gb
  rules:
    - !reference [.rule_templates, not_on_git_tags]
    - !reference [.rule_templates, automatically_on_any_other]

check_type_errors:
  image: 'europe-north1-docker.pkg.dev/holi-shared/docker/holi-docker/node-expo-eas'
  needs: ['lint_compile_test']
  cache: !reference [.yarn-cache-readonly]
  script:
    - git fetch
    # if this was a merge request pipeline we could use $CI_MERGE_REQUEST_TARGET_BRANCH_NAME as target branch parameter
    # unfortunately all our build pipelines are branch pipelines. origin/main is good enough for our purposes as almost
    # all MRs go against staging (eventually)
    - corepack enable
    - ./scripts/check-type-errors-count.sh $CI_COMMIT_SHA origin/main
  rules:
    - !reference [.rule_templates, not_on_git_tags]
    - !reference [.rule_templates, any_but_production_staging]
    - !reference [.rule_templates, automatically_on_any_other]

# the web and mobile only pipeline steps are defined in separate files for better overview and separation of concerns
include:
  - '/.gitlab-ci-web.yml'
  - '/.gitlab-ci-mobile.yml'
