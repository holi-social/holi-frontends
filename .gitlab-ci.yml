# TODO speed up yarn dependency caching https://medium.com/disdj/speed-up-npm-yarn-install-in-gitlab-1434437f9857

# caching strategy follows "Solution 1" taken from https://medium.com/disdj/speed-up-npm-yarn-install-in-gitlab-1434437f9857
# first job (lint_compile_test) warms the cache (read-write), subsequent jobs only read from it
# cache key corresponds to current branch name ($CI_COMMIT_REF_SLUG)
cache:
  key: $CI_COMMIT_REF_SLUG
  policy: pull
  untracked: true

default:
  before_script:
    - set -ex
    - env
  tags:
    - holi-small

variables:
  FF_USE_FASTZIP: "true" # enable fastzip - a faster zip implementation that also supports level configuration.
  ARTIFACT_COMPRESSION_LEVEL: fastest # can be set to fastest, fast, default, slow and slowest. If just enabling fastzip is not enough try setting this to fastest or fast.
  CACHE_COMPRESSION_LEVEL: fastest # same as above, but for caches
  TRANSFER_METER_FREQUENCY: 5s # will display transfer progress every 5 seconds for artifacts and remote caches.
  # for other possible cache performance settings, see https://docs.gitlab.com/ee/ci/runners/configure_runners.html#artifact-and-cache-settings
  FF_SCRIPT_SECTIONS: "true" # When enabled, each script line from the .gitlab-ci.yml file will be in a collapsible section in the job output and show the duration of each line. 

lint_compile_test:
  stage: build
  image: 'registry.gitlab.com/holisticfoundation/holi-docker/alpine-node-expo-eas'
  script:
    - yarn install
    - yarn lint
    - yarn test
  cache:
    key: $CI_COMMIT_REF_SLUG
    policy: pull-push
    paths:
      - 'node_modules'
      - 'apps/*/node_modules'
      - 'holi-apps/*/node_modules'
      - 'packages/*/node_modules'
      - 'core/node_modules'
      - 'e2e/*/node_modules'
  interruptible: true
  tags:
    - holi-big

# the web and mobile only pipeline steps are defined in separate files for better overview and separation of concerns
include:
  - '/.gitlab-ci-web.yml'
  - '/.gitlab-ci-mobile.yml'
