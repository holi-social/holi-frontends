variables:
  YARN_CACHE_FOLDER: '$CI_PROJECT_DIR/.yarn/cache'
  YARN_ENABLE_GLOBAL_CACHE: 'false'
  GIT_DEPTH: 120

.yarn-cache-rw:
  key:
    files:
      - yarn.lock
  paths:
    - .yarn/
  policy: pull-push

.yarn-cache-readonly:
  key:
    files:
      - yarn.lock
  paths:
    - .yarn/
  policy: pull

.rule_templates:
  not_on_git_tags:
    - if: '$CI_COMMIT_TAG'
      when: never
  skip_environment_for_web:
    - if: $CI_COMMIT_BRANCH =~ /^noenv\/.*|^noweb\/.*/
      when: never
  skip_environment_for_mobile:
    - if: $CI_COMMIT_BRANCH =~ /^noenv\/.*|^nomobile\/.*/
      when: never
  only_on_production_release:
    - !reference [.rule_templates, not_on_git_tags]
    - if: $CI_COMMIT_BRANCH =~ /^release\/.*/
      when: on_success
  manually_on_production_release:
    - !reference [.rule_templates, not_on_git_tags]
    - if: $CI_COMMIT_BRANCH =~ /^release\/.*/
      when: manual
  automatically_on_staging:
    - !reference [.rule_templates, not_on_git_tags]
    - if: $CI_COMMIT_BRANCH == "main"
      when: on_success
  manually_on_staging:
    - !reference [.rule_templates, not_on_git_tags]
    - if: $CI_COMMIT_BRANCH == "main"
      when: manual
  any_but_production_staging:
    - !reference [.rule_templates, not_on_git_tags]
    - if: $CI_COMMIT_BRANCH =~ /^release\/.*|^main$/
      when: never
  automatically_on_any_other:
    - if: $CI_COMMIT_BRANCH
      when: on_success
  manually_on_any_other:
    - if: $CI_COMMIT_BRANCH
      when: manual
  automatically_on_scheduled_e2e_test_run:
    - if: $CI_PIPELINE_SOURCE == "schedule" && $CI_RUN_E2E_TESTS == "true"
      when: on_success
  automatically_update_translations:
    - if: $CI_PIPELINE_SOURCE == "schedule" && $CI_UPDATE_TRANSLATIONS == "true"
      when: on_success

default:
  before_script:
    - set -e
    # DANGER don't use `set -x` or print the environment via e.g. `env` in pipeline runs, this might leak credentials (has leaked them)
  tags:
    - 1cpu-4gb
  image: 'europe-north1-docker.pkg.dev/holi-shared/docker/holi-docker/node-expo-eas'

install_deps:
  stage: build
  image: 'europe-north1-docker.pkg.dev/holi-shared/docker/holi-docker/node-expo-eas'
  cache: !reference [.yarn-cache-rw]
  interruptible: true
  script:
    - corepack enable
    - yarn install --immutable
  rules:
    # always run when triggered manually
    - if: $CI_COMMIT_BRANCH && $CI_PIPELINE_SOURCE == "web"
      when: on_success
    # only run on specific file changes when triggered by git push
    - if: $CI_COMMIT_BRANCH
      changes:
        - yarn.lock
        - .gitlab-ci.yml

update_translations:
  stage: build
  needs:
    - job: install_deps
      optional: true
  allow_failure: true
  image: 'europe-north1-docker.pkg.dev/holi-shared/docker/holi-docker/node-expo-eas'
  cache: !reference [.yarn-cache-rw]
  script:
    - corepack enable
    - yarn install --immutable --immutable-cache
    - git config user.email "ci@holi.social"
    - git config user.name "CI Bot"
    # Using project access token until CI jobs are allowed to push themselves
    # See https://gitlab.com/gitlab-org/gitlab/-/issues/389060
    - git remote set-url origin https://oauth2:${GITLAB_CI_UPDATE_TRANSLATION_PUSH_TOKEN}@gitlab.holi.team/app/holi-frontends.git
    - LOCALAZY_API_KEY_READ=$LOCALAZY_API_KEY_READ BRANCH=$CI_COMMIT_BRANCH scripts/download_translations.sh
  rules:
    - !reference [.rule_templates, automatically_update_translations]

lint_compile_test:
  stage: build
  needs:
    - job: install_deps
      optional: true
    - job: update_translations
      optional: true
  image: 'europe-north1-docker.pkg.dev/holi-shared/docker/holi-docker/node-expo-eas'
  cache: !reference [.yarn-cache-rw]
  script:
    - corepack enable
    # If CI Cache is empty because install_deps did not run, install filling the cache, otherwise install from the immutable cache
    # install_deps does not run on long living branches, and it might not run on pipeline failures on the first build of a branch
    - '[ ! -d ".yarn/cache" ] && yarn install --immutable || yarn install --immutable --immutable-cache'
    - yarn format:check
    - yarn check-types
    - git fetch origin main:main # needed for 'yarn workspaces foreach ... (lint_all task)'
    - git fetch origin $CI_COMMIT_BRANCH
    - git rebase origin/$CI_COMMIT_BRANCH || true
    - yarn lint_all
    - yarn test:coverage
  coverage: '/^Statements\s*:\s*([^%]+)/'
  artifacts:
    name: 'unit test coverage report'
    expose_as: 'unit test coverage report'
    expire_in: "30 days"
    paths:
      - coverage/
  interruptible: true
  tags:
    - 4cpu-16gb
  rules:
    - !reference [.rule_templates, not_on_git_tags]
    - !reference [.rule_templates, automatically_on_any_other]

# the web and mobile only pipeline steps are defined in separate files for better overview and separation of concerns
include:
  - '/.gitlab-ci-web.yml'
  - '/.gitlab-ci-mobile.yml'
