query SignedPetitions($offset: Int! = 0, $limit: Int! = 10) {
  signedPetitions(offset: $offset, limit: $limit) {
    totalResults
    data {
      externalPetitionId
      status
    }
  }
}

query PetitionStatus($petitionId: String!) {
  petitionStatus(petitionId: $petitionId) {
    externalPetitionId
    status
  }
}
