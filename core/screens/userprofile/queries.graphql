fragment FullUser on User {
  id
  identity
  avatar
  avatarBlurhash
  avatarDefaultColor
  avatarLabel
  fullName
  firstName
  lastName
  aboutMe
  pronouns
  location
  role
  geolocationId
  engagementLevel
  interestsV2
  sdgs {
    id
    title
    slug
  }
  skillsV2
  connectionStatusToMyself
}

query AuthenticatedUser {
  authenticatedUser {
    ...FullUser
  }
}
