fragment FullUser on User {
  id
  identity
  avatar
  avatarBlurhash
  avatarDefaultColor
  avatarLabel
  fullName
  firstName
  lastName
  aboutMe
  pronouns
  location
  role
  geolocationId
  engagementLevel
  interestsV2
  skillsV2
  connectionStatusToMyself
}

query AuthenticatedUser {
  authenticatedUser {
    ...FullUser
  }
}

query CommittedVolunteeringOpportunities($offset: Int!, $limit: Int!) {
  committedVolunteeringOpportunities(offset: $offset, limit: $limit) {
    data {
      status
      externalVolunteeringOpportunityId
    }
    totalResults
  }
}

# Get the global rewards counter
query GetGlobalRewardsCounter {
  rewards_globalCounter {
    counter
  }
}

# Get paginated rewards transactions
query GetRewardsTransactions($offset: Int!, $limit: Int!) {
  rewards_transactions(offset: $offset, limit: $limit) {
    totalResults
    data {
      id
      rewardType
      createdAt
    }
  }
}
