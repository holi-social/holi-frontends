query SpaceRecommendation($topicIds: [UUID], $limit: Int) {
  recommendedSpaces(topicIds: $topicIds, limit: $limit) {
    data {
      ...SpaceCard
    }
    totalResults
  }
}

fragment SpaceCard on Space {
  title
  name
  description
  location
  id
  cover
  members {
    data {
      user {
        id
        avatar
        avatarLabel
        avatarDefaultColor
        avatarBlurhash
        fullName
      }
    }
    totalResults
  }
}
