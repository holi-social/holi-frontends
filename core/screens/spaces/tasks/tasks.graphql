query taskById($id: UUID!) {
  taskById(id: $id) {
    id
    name
    description
    slotsAvailable
    slotsTaken
    location
    regularity
    visibility
    locationType
    contactEmail
    contactPhone
    thumbnail
    thumbnailBlurhash
    created
    creator {
      id
      avatar
      avatarBlurhash
      fullName
    }
    space {
      id
      connectionStatusToMyself
      name
      title
      avatar
      avatarBlurhash
      topicsV2
    }
    skillsV2
  }
}

mutation deleteTask($id: UUID!) {
  deleteTask(id: $id) {
    success
  }
}
