query taskById($id: UUID!) {
  taskById(id: $id) {
    id
    name
    description
    slotsAvailable
    slotsTaken
    location
    regularity
    visibility
    locationType
    contactEmail
    contactPhone
    thumbnail
    thumbnailBlurhash
    created
    creator {
      id
      avatar
      avatarBlurhash
      fullName
    }
    space {
      id
      connectionStatusToMyself
      name
      title
      avatar
      avatarBlurhash
      topicsV2
    }
    skillsV2
  }
}

mutation CreateTask($input: CreateTaskInput!) {
  createTask(input: $input) {
    id
    name
    description
    visibility
    regularity
    duration
    timeframeStartDate
    timeframeEndDate
    locationType
    location
    contactEmail
    contactPhone
  }
}

mutation UpdateTask($input: UpdateTaskInput!) {
  updateTask(input: $input) {
    id
    name
    description
    visibility
    regularity
    duration
    timeframeStartDate
    timeframeEndDate
    locationType
    location
    contactEmail
    contactPhone
    thumbnail
  }
}

mutation DeleteTask($id: UUID!) {
  deleteTask(id: $id) {
    success
  }
}
