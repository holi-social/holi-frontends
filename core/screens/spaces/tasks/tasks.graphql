query taskById($id: UUID!) {
  taskById(id: $id) {
    id
    name
    description
    slotsAvailable
    slotsTaken
    location
    regularity
    visibility
    locationType
    contactEmail
    contactPhone
    thumbnail
    thumbnailBlurhash
    created
    creator {
      id
      avatar
      avatarBlurhash
      fullName
    }
    space {
      id
      connectionStatusToMyself
      name
      title
      avatar
      avatarBlurhash
      topics {
        id
        title
      }
    }
    skills {
      id
      title
    }
  }
}

mutation deleteTask($id: UUID!) {
  deleteTask(id: $id) {
    success
  }
}
