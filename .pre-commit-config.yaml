repos:
  - repo: local
    hooks:
      - id: format:check
        name: format:check
        language: system
        entry: corepack yarn format:check
        files: \.(js|jsx|ts|tsx)$
        pass_filenames: true
        # always_run: true  <-- we want this to run on added files only not on all files

      - id: lint
        name: lint
        language: system
        entry: corepack yarn lint
        files: \.(js|jsx|ts|tsx)$
        pass_filenames: true
        # always_run: true  <-- we want this to run on added files only not on all files

  - repo: git@gitlab.holi.team:app/holi-meta.git
    rev: 345e2cab6704f708a946c08a9eaa1ba769c455fb
    hooks:
      - id: scan-comments
      - id: security-checks
      - id: gitleaks
