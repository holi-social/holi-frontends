mobile_review_publish:
  needs: ['lint_compile_test']
  image: 'registry.gitlab.com/holisticfoundation/holi-docker/alpine-node-expo-eas'
  script:
    - cd apps/mobile
    - expo publish --release-channel $CI_ENVIRONMENT_SLUG
  environment:
    name: review/mobile-$CI_COMMIT_REF_SLUG
    url: https://expo.dev/@holistic-foundation/projectholi?serviceType=classic&distribution=expo-go&release-channel=$CI_ENVIRONMENT_SLUG
  except:
    - main
    - /^noenv\/.*/

mobile_staging_publish:
  needs: ['lint_compile_test']
  image: 'registry.gitlab.com/holisticfoundation/holi-docker/alpine-node-expo-eas'
  script:
    - cd apps/mobile
    - expo publish --release-channel staging
  environment:
    name: mobile-staging
    deployment_tier: staging
    url: https://expo.dev/@holistic-foundation/projectholi?serviceType=classic&distribution=expo-go&release-channel=staging
  only:
    - main

mobile_staging_build:
  needs: ['lint_compile_test']
  image: 'registry.gitlab.com/holisticfoundation/holi-docker/alpine-node-expo-eas'
  script:
    - 'cd apps/mobile'
    - 'eas build --platform all --profile preview --non-interactive'
    - 'export APK_URL=$(eas build:list --gitCommitHash ${CI_COMMIT_SHA} --json --platform android --limit 1 2> /dev/null | jq -r ".[0].artifacts.buildUrl")' # extracts build URL from EAS
    - 'export IPA_URL=$(eas build:list --gitCommitHash ${CI_COMMIT_SHA} --json --platform ios --limit 1 2> /dev/null | jq -r ".[0].artifacts.buildUrl")' # extracts build URL from EAS
    - 'mkdir -p artifacts_staging'
    - 'curl -o artifacts_staging/$(basename $APK_URL) $APK_URL'
    - 'curl -o artifacts_staging/$(basename $IPA_URL) $IPA_URL'
  artifacts:
    paths:
      - artifacts_staging/
  only:
    - main
    - HOLI-1321_eas-browserstack-ios
    - HOLI-1368_fix-android-e2e

mobile_staging_e2e_android:
  needs: ['mobile_staging_build']
  image: 'registry.gitlab.com/holisticfoundation/holi-docker/alpine-node-expo-eas'
  script:
    - cd apps/mobile
    - export EAS_APK_URL=$(eas build:list --gitCommitHash ${CI_COMMIT_SHA} --json --platform android --limit 1 | jq -r ".[0].artifacts.buildUrl") # extracts build URL from EAS
    - export EAS_APK_FILE=$(basename $EAS_APK_URL)
    - curl -L -s -o ../../e2e/mobile/$EAS_APK_FILE $EAS_APK_URL # download .apk from EAS
    - cd ../../e2e/mobile
    - yarn install
    - export BROWSERSTACK_UPLOAD_RESPONSE=$(curl -s -u "${BROWSERSTACK_USERNAME}:${BROWSERSTACK_ACCESS_KEY}" -X POST "https://api-cloud.browserstack.com/app-automate/upload" -F "file=@${EAS_APK_FILE}")
    - export BROWSERSTACK_APP_URL=$(echo "${BROWSERSTACK_UPLOAD_RESPONSE}" | jq -r '.app_url')
    - CODECEPT_PLATFORM=android yarn run codeceptjs
  allow_failure: true
  only:
    - main
    - HOLI-1321_eas-browserstack-ios
    - HOLI-1368_fix-android-e2e

mobile_staging_e2e_ios:
  needs: ['mobile_staging_build']
  image: 'registry.gitlab.com/holisticfoundation/holi-docker/alpine-node-expo-eas'
  script:
    - cd apps/mobile
    - export EAS_IPA_URL=$(eas build:list --gitCommitHash ${CI_COMMIT_SHA} --json --platform ios --limit 1 | jq -r ".[0].artifacts.buildUrl") # extracts build URL from EAS
    - export EAS_IPA_FILE=$(basename $EAS_IPA_URL)
    - curl -L -s -o ../../e2e/mobile/$EAS_IPA_FILE $EAS_IPA_URL # download .ipa from EAS
    - cd ../../e2e/mobile
    - yarn install
    - export BROWSERSTACK_UPLOAD_RESPONSE=$(curl -s -u "${BROWSERSTACK_USERNAME}:${BROWSERSTACK_ACCESS_KEY}" -X POST "https://api-cloud.browserstack.com/app-automate/upload" -F "file=@${EAS_IPA_FILE}")
    - export BROWSERSTACK_APP_URL=$(echo "${BROWSERSTACK_UPLOAD_RESPONSE}" | jq -r '.app_url')
    - CODECEPT_PLATFORM=ios yarn run codeceptjs
  allow_failure: true
  only:
    - main
    - HOLI-1321_eas-browserstack-ios
    - HOLI-1368_fix-android-e2e

mobile_production_publish:
  needs: ['mobile_staging_e2e_android', 'mobile_staging_e2e_ios']
  when: manual
  image: 'registry.gitlab.com/holisticfoundation/holi-docker/alpine-node-expo-eas'
  script:
    - cd apps/mobile
    - expo publish --release-channel production
  environment:
    name: mobile-production
    deployment_tier: production
    url: https://expo.dev/@holistic-foundation/projectholi?serviceType=classic&distribution=expo-go&release-channel=production
  only:
    - main

mobile_production_build:
  needs: ['mobile_staging_e2e_android', 'mobile_staging_e2e_ios']
  when: manual
  image: 'registry.gitlab.com/holisticfoundation/holi-docker/alpine-node-expo-eas'
  script:
    - 'cd apps/mobile'
    - 'eas build --platform all --profile production --non-interactive'
    - 'export APK_URL=$(eas build:list --gitCommitHash ${CI_COMMIT_SHA} --json --platform android --limit 1 2> /dev/null | jq -r ".[0].artifacts.buildUrl")' # extracts build URL from EAS
    - 'export IPA_URL=$(eas build:list --gitCommitHash ${CI_COMMIT_SHA} --json --platform ios --limit 1 2> /dev/null | jq -r ".[0].artifacts.buildUrl")' # extracts build URL from EAS
    - 'mkdir -p artifacts_production'
    - 'curl -o artifacts_production/$(basename $APK_URL) $APK_URL'
    - 'curl -o artifacts_production/$(basename $IPA_URL) $IPA_URL'
  artifacts:
    paths:
      - artifacts_production/
  only:
    - main

# disabled (hidden) (not implemented yet), only increases build times and uses up runner minutes
.mobile_production_submit:
  needs: ['mobile_production_build']
  image: 'registry.gitlab.com/holisticfoundation/holi-docker/alpine-node-expo-eas'
  script:
    - echo 'submission to app store(s) goes here'
  only:
    - main

