variables:
  UI_DOMAIN_PATH: '$CI_PROJECT_DIR/ui_domain'

default:
  before_script:
    - set -e
    # env -0 | sort -z | tr '\0' '\n': Sort env output alphabetically, keeping multiline variables intact
    # egrep: Remove sensitive information from the output of env
    #- env -0 | sort -z | tr '\0' '\n' | egrep -ve '^(DOCKER_AUTH_CONFIG|GOOGLE_APPLICATION_CREDENTIALS)=.*'

# job templates

.web_deploy:
  image:
    name: 'europe-north1-docker.pkg.dev/holi-shared/docker-hub-remote/hashicorp/terraform:1.6.6'
    # default entrypoint is terraform command, but we want to run shell scripts
    entrypoint: ['/bin/sh', '-c']
  variables:
    ENVIRONMENT_ID: $CI_ENVIRONMENT_SLUG
  cache: [] # explicitly disable caching
  dependencies: [] # explicitly disable artifact usage
  artifacts:
    paths:
      - 'terraform/environments/web/crash.log' # optional, only available in case of a crash/panic
      - 'terraform/environments/web/terraform-*.log' # separate log for every step/command
      - $UI_DOMAIN_PATH
    name: '${CI_JOB_NAME}_${CI_JOB_ID}'
    when: always
    expire_in: 1 week
  script:
    - terraform/environments/web/scripts/create-or-update-env.sh $ENVIRONMENT_ID $CI_COMMIT_SHA
    - echo "$(terraform/environments/web/scripts/get-output.sh app_domain)" > $UI_DOMAIN_PATH
  resource_group: $ENVIRONMENT_ID # never execute terraform in parallel on the same environment
  interruptible: false

.web_e2e:
  image: 'mcr.microsoft.com/playwright:v1.40.0-focal'
  dependencies: [] # explicitly disable artifact usage
  artifacts:
    name: 'web e2e test report'
    expose_as: 'web e2e test report'
    expire_in: 1 week
    paths:
      - e2e/web/playwright-report # report including traces
      # - e2e/web/test-results # contains artifacts (videos, screenshots, traces) organized by test case/run, redundant to playwright-report and doubling the artifacts size
      - e2e/web/artifacts # accessibility reports
    when: always
  script: |
    export UI_DOMAIN=`cat $UI_DOMAIN_PATH`
    terraform/environments/web/scripts/wait-for-ssl.sh "https://${UI_DOMAIN}"
    cd e2e/web
    yarn install
    BASE_URL="https://${UI_DOMAIN}" yarn run playwright test
  interruptible: true
  tags:
    - 4cpu-16gb

# end job templates

# pipeline in chronological order

## common steps

web_build:
  needs: ['lint_compile_test']
  image: 'europe-north1-docker.pkg.dev/holi-shared/docker/holi-docker/alpine-node-expo-eas'
  script:
    - yarn web:build
    - ./scripts/generate-license-documents.sh
  # Enable cache for Next.js web build as suggested on https://nextjs.org/docs/pages/building-your-application/deploying/ci-build-caching#gitlab-ci
  cache:
    key: ${CI_COMMIT_REF_SLUG}
    paths:
      - node_modules/
      - apps/web/.next/cache/
  artifacts:
    paths:
      - apps/web/.next
    expire_in: 1 week
  interruptible: true
  tags:
    - 4cpu-16gb
  rules:
    - if: $CI_COMMIT_BRANCH =~ /^noweb\/.*/
      when: never
    - if: $CI_COMMIT_BRANCH
      when: on_success
  variables:
    WEB_BUILD: true

storybook_publish:
  needs: ['web_build']
  environment:
    name: storybook-main
    url: https://main--63846e9768032326df3b0c75.chromatic.com
    deployment_tier: staging
  image: 'europe-north1-docker.pkg.dev/holi-shared/docker/holi-docker/alpine-node-expo-eas' # too much, but since it is there...
  script:
    - yarn storybook:publish
  artifacts:
    paths:
      - apps/storybook/build-storybook.log
    expire_in: 1 week
  interruptible: true
  tags:
    - 4cpu-16gb
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      changes:
        - apps/storybook/*
        - packages/ui/*
        - '**/*.stories.tsx'

web_build_docker:
  needs: ['web_build']
  image: 'europe-north1-docker.pkg.dev/holi-shared/docker-hub-remote/docker:27'
  services:
    - 'docker:27-dind'
  cache: [] # explicitly disable caching
  dependencies:
    - web_build
  variables:
    # this could be fetched via terraform output ("gcr_location" in infra project), but then we would need an extra job for terraform
    GCR_IMAGE: europe-north1-docker.pkg.dev/holi-shared/docker/holi-frontends-web
    # https://about.gitlab.com/blog/2019/07/31/docker-in-docker-with-docker-19-dot-03/
    DOCKER_TLS_CERTDIR: '/certs'
  script:
    - cd apps/web/
    - docker pull $GCR_IMAGE || true # Allows us to use --cache-from, we need to tag with latest in the next command for this to work
    - docker build --cache-from $GCR_IMAGE -t $GCR_IMAGE:latest -t $GCR_IMAGE:$CI_COMMIT_SHA -t $GCR_IMAGE:$CI_COMMIT_REF_SLUG .
    - docker push $GCR_IMAGE:$CI_COMMIT_SHA # this is the tag that is used for deployment
    - docker push $GCR_IMAGE:$CI_COMMIT_REF_SLUG # just for easyly knowing which is the last image for a branch
  interruptible: true
  rules:
    - if: $CI_COMMIT_BRANCH =~ /^noenv\/.*|^noweb\/.*/
      when: never
    - if: $CI_COMMIT_BRANCH
      when: on_success

## only for review environments

web_review_deploy:
  extends: .web_deploy
  needs: ['web_build_docker']
  environment:
    name: review/$CI_COMMIT_REF_SLUG-web
    url: https://$CI_ENVIRONMENT_SLUG.dev.holi.social
    on_stop: web_review_destroy
    auto_stop_in: 1 week
  rules:
    - if: $CI_COMMIT_BRANCH =~ /main|^production.*|^noenv\/.*|^noweb\/.*/
      when: never
    - if: $CI_COMMIT_BRANCH
      when: on_success
  after_script: |
    wget --header="Content-Type: application/json" \
      --post-data='{"channel": "#release-status", "branch": "'$CI_COMMIT_REF_SLUG'", "text":"The web environment for the release candidate \"'$CI_COMMIT_REF_SLUG'\" has been updated to \"'"$CI_COMMIT_TITLE"'\" and is available and/or updated under https://'"$(cat $UI_DOMAIN_PATH)"'"}' \
      --output-document - \
      https://projectholi.rocket.chat/hooks/$ROCKETCHAT_HOOK_RELEASE_NOTIFIER

web_review_e2e:
  extends: .web_e2e
  needs: ['web_review_deploy']
  dependencies:
    - web_review_deploy
  rules:
    - if: $CI_COMMIT_BRANCH =~ /main|^production.*|^noenv\/.*|^noweb\/.*/
      when: never
    - if: $CI_COMMIT_BRANCH
      when: on_success

web_review_destroy:
  needs: ['web_review_deploy']
  image:
    name: 'europe-north1-docker.pkg.dev/holi-shared/docker-hub-remote/hashicorp/terraform:1.6.6'
    # default entrypoint is terraform command, but we want to run shell scripts
    entrypoint: ['/bin/sh', '-c']
  variables:
    # has to be set to none for auto stop
    GIT_STRATEGY: none
  environment:
    name: review/$CI_COMMIT_REF_SLUG-web
    action: stop
  cache: [] # explicitly disable caching
  dependencies: [] # explicitly disable artifact usage
  artifacts:
    paths:
      - "terraform/environments/web/crash.log" # optional, only available in case of a crash/panic
      - "terraform/environments/web/terraform-*.log" # separate log for every step/command
    name: "${CI_JOB_NAME}_${CI_JOB_ID}"
    when: on_failure
    expire_in: 1 week
  before_script:
  script:
    # branch may have been deleted, so we clone and checkout main
    - git clone $CI_REPOSITORY_URL main-clone
    - cd main-clone
    - terraform/environments/web/scripts/destroy-env.sh $CI_ENVIRONMENT_SLUG
  # can't use rules here: https://gitlab.com/gitlab-org/gitlab/-/issues/34077
  allow_failure: false
  rules:
    - if: $CI_COMMIT_BRANCH =~ /main|^production.*|^noenv\/.*|^noweb\/.*/
      when: never
    - if: $CI_COMMIT_BRANCH
      when: manual
  resource_group: $CI_ENVIRONMENT_SLUG # never execute terraform in parallel on the same environment
  interruptible: false

## staging environment

web_staging_deploy:
  extends: .web_deploy
  needs: ['web_build_docker']
  environment:
    name: web-staging
    deployment_tier: staging
    url: https://staging.dev.holi.social
  variables:
    ENVIRONMENT_ID: staging
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

web_staging_e2e:
  extends: .web_e2e
  needs: ['web_staging_deploy']
  dependencies:
    - web_staging_deploy
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

## production environment

web_production_deploy:
  extends: .web_deploy
  needs: ['web_build_docker']
  allow_failure: false
  environment:
    name: web-production
    deployment_tier: production
    url: https://app.holi.social
  variables:
    ENVIRONMENT_ID: production
  rules:
    - if: $CI_COMMIT_BRANCH =~ /^production.*|^hotfix.*/
      when: manual
