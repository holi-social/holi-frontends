variables:
  UI_DOMAIN_PATH: '$CI_PROJECT_DIR/ui_domain'

default:
  before_script:
    - set -ex
    - env

# job templates

.web_deploy:
  image:
    name: 'hashicorp/terraform:1.1.9'
    # default entrypoint is terraform command, but we want to run shell scripts
    entrypoint: ['/bin/sh', '-c']
  variables:
    ENVIRONMENT_ID: $CI_ENVIRONMENT_SLUG
  cache: [] # explicitly disable caching
  dependencies: [] # explicitly disable artifact usage
  artifacts:
    paths:
      - 'terraform/environments/web/scripts/crash.log' # optional, only available in case of a crash/panic
      - 'terraform/environments/web/scripts/terraform-*.log' # separate log for every step/command
      - $UI_DOMAIN_PATH
    name: '${CI_JOB_NAME}_${CI_JOB_ID}'
    #when: on_failure
  script:
    - export GOOGLE_APPLICATION_CREDENTIALS=${GOOGLE_CLOUD_SERVICE_ACCOUNT}
    - terraform/environments/web/scripts/create-or-update-env.sh $ENVIRONMENT_ID $CI_COMMIT_SHA
    - echo "$(terraform/environments/web/scripts/get-app-domain.sh)" > $UI_DOMAIN_PATH
  resource_group: $ENVIRONMENT_ID # never execute terraform in parallel on the same environment
  interruptible: false

.web_e2e:
  image: 'mcr.microsoft.com/playwright:v1.25.0-focal'
  dependencies: [] # explicitly disable artifact usage
  artifacts:
    name: 'web e2e test report'
    expose_as: 'web e2e test report'
    expire_in: 1 month
    paths:
      - e2e/web/playwright-report
      - e2e/web/test-results
    when: on_failure
  script:
    - UI_DOMAIN=`cat $UI_DOMAIN_PATH`
    - terraform/environments/web/scripts/wait-for-ssl.sh "https://${UI_DOMAIN}"
    - cd e2e/web
    - yarn install
    - BASE_URL="https://${UI_DOMAIN}" yarn run playwright test
  interruptible: true
  tags:
    - holi-big

# end job templates

# pipeline in chronological order

## common steps

web_build:
  needs: ['lint_compile_test']
  image: 'registry.gitlab.com/holisticfoundation/holi-docker/alpine-node-expo-eas'
  script:
    - yarn web:build
  artifacts:
    paths:
      - apps/web/.next
  interruptible: true
  tags:
    - holi-big
  except:
    - /^noweb\/.*/

web_build_docker:
  needs: ['web_build']
  image: docker:20.10
  services:
    - docker:20.10-dind
  cache: [] # explicitly disable caching
  dependencies:
    - web_build
  variables:
    # this could be fetched via terraform output ("gcr_location" in infra project), but then we would need an extra job for terraform
    GCR_IMAGE: eu.gcr.io/holi-shared/holi-frontends-web
    # https://about.gitlab.com/blog/2019/07/31/docker-in-docker-with-docker-19-dot-03/
    DOCKER_TLS_CERTDIR: '/certs'
  before_script:
    - cat $GOOGLE_CLOUD_SERVICE_ACCOUNT | docker login -u _json_key --password-stdin https://eu.gcr.io
  script:
    - cd apps/web/
    - docker pull $GCR_IMAGE || true # Allows us to use --cache-from
    - docker build --cache-from $GCR_IMAGE -t $GCR_IMAGE:$CI_COMMIT_SHA -t $GCR_IMAGE:$CI_COMMIT_REF_SLUG .
    - docker push $GCR_IMAGE:$CI_COMMIT_SHA # this is the tag that is used for deployment
    - docker push $GCR_IMAGE:$CI_COMMIT_REF_SLUG # just for easyly knowing which is the last image for a branch
  interruptible: true
  except:
    - /^noenv\/.*/
    - /^noweb\/.*/

## only for review environments

web_review_deploy:
  extends: .web_deploy
  needs: ['web_build_docker']
  environment:
    name: review/$CI_COMMIT_REF_SLUG-web
    url: https://$CI_ENVIRONMENT_SLUG.web.project-holi.org
    on_stop: web_review_destroy
    auto_stop_in: 1 week
  except:
    - main
    - /^noenv\/.*/
    - /^noweb\/.*/

web_review_e2e:
  extends: .web_e2e
  needs: ['web_review_deploy']
  dependencies:
    - web_review_deploy
  except:
    - main
    - /^noenv\/.*/
    - /^noweb\/.*/

web_review_destroy:
  needs: ['web_review_deploy']
  image:
    name: 'hashicorp/terraform:1.1.9'
    # default entrypoint is terraform command, but we want to run shell scripts
    entrypoint: ['/bin/sh', '-c']
  variables:
    # has to be set to none for auto stop
    GIT_STRATEGY: none
  environment:
    name: review/$CI_COMMIT_REF_SLUG-web
    action: stop
  cache: [] # explicitly disable caching
  dependencies: [] # explicitly disable artifact usage
  before_script:
  script:
    - export GOOGLE_APPLICATION_CREDENTIALS=${GOOGLE_CLOUD_SERVICE_ACCOUNT}
    # branch may have been deleted, so we clone and checkout main
    - git clone $CI_REPOSITORY_URL main-clone
    - cd main-clone
    - terraform/environments/web/scripts/destroy-env.sh $CI_ENVIRONMENT_SLUG
  # can't use rules here: https://gitlab.com/gitlab-org/gitlab/-/issues/34077
  when: manual
  except:
    - main
    - /^noenv\/.*/
    - /^noweb\/.*/
  resource_group: $CI_ENVIRONMENT_SLUG # never execute terraform in parallel on the same environment
  interruptible: false

## staging environment

web_staging_deploy:
  extends: .web_deploy
  needs: ['web_build_docker']
  environment:
    name: web-staging
    deployment_tier: staging
    url: https://staging.web.project-holi.org
  variables:
    ENVIRONMENT_ID: staging
  only:
    - main

web_staging_e2e:
  extends: .web_e2e
  needs: ['web_staging_deploy']
  dependencies:
    - web_staging_deploy
  only:
    - main

## production environment

web_production_deploy:
  extends: .web_deploy
  needs: ['web_staging_e2e']
  when: manual
  environment:
    name: web-production
    deployment_tier: production
    url: https://production.web.project-holi.org
  variables:
    ENVIRONMENT_ID: production
  only:
    - main
