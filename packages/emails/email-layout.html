<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html
  xmlns="http://www.w3.org/1999/xhtml"
  xmlns:v="urn:schemas-microsoft-com:vml"
  xmlns:o="urn:schemas-microsoft-com:office:office"
>
  <head>
    <!--[if gte mso 9]>
      <xml>
        <o:OfficeDocumentSettings>
          <o:AllowPNG />
          <o:PixelsPerInch>96</o:PixelsPerInch>
        </o:OfficeDocumentSettings>
      </xml>
    <![endif]-->
    <meta http-equiv="Content-type" content="text/html; charset=utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1"
    />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="format-detection" content="date=no" />
    <meta name="format-detection" content="address=no" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="x-apple-disable-message-reformatting" />

    <title>{{subject}}</title>
    <!--[if gte mso 9]>
      <style type="text/css" media="all">
        sup {
          font-size: 100% !important;
        }
      </style>
    <![endif]-->
    <!-- Novu throws error for empty style tags -->
    <!--<style type="text/css" media="screen"></style>-->
  
  </head>
  <body
    class="body"
    style="
      margin: 0 !important;
      display: block !important;
      min-width: 100% !important;
      width: 100% !important;
      font-family: Trebuchet MS, Helvetica, sans-serif;
    "
  >
    <table
      width="100%"
      border="0"
      cellspacing="0"
      cellpadding="0"
      bgcolor="#ffffff"
    >
      <tr>
        <td align="center" valign="top">
          <!-- Header -->
          <table width="100%" border="0" cellspacing="0" cellpadding="0">
            <tr>
              <td
                style="
                  padding: 24px;
                  padding-top: 64px;
                  background-color: #f5f5f5;
                  border-radius: 14px;
                  line-height: 0px;
                  width: 100%;
                "
              >
                <img
                  width="55.63px"
                  height="24px"
                  alt="holi"
                  src="https://ik.imagekit.io/holi/holi_logo_ajPMRkTXG.png"
                />
              </td>
            </tr>
          </table>
          <!-- END Header -->

          <!-- Body -->
          {{{body}}}
          <!-- END Body -->

          <!-- Footer -->
          <table width="100%" border="0" cellspacing="0" cellpadding="0">
            <tr>
              <td>
                <div
                  style="
                    padding: 24px 40px 0px 40px;
                    border-radius: 32px 32px 0 0;
                    border: 1px solid #ebebeb;
                    border-bottom: none;
                    color: #787777;
                    font-size: 12px;
                    line-height: 26px;
                    text-align: center;
                  "
                >
                <p>
                    You can always <a href="{{unsubscribe_url}}" style="color: #787777">unsubscribe</a> from this 3-part welcome series                
                </p>
                <p>
                    Holi Moli GmbH • Eifflerstraße 43, 22769 Hamburg
                </p>
                </div>
              </td>
            </tr>
          </table>
          <!-- END Footer -->
        </td>
      </tr>
    </table>
  </body>
</html>
