schema {
  query: Query
}

type Query {
  Post(id: ID!): Post
  User(id: ID!): User
  allPosts(offset: Int, limit: Int): [Post]
  allUsers(offset: Int, limit: Int): [User]
}

type Post {
  id: ID!
  title: String!
  text: String!
  views: Int!
  user_id: ID!
  User: User
}

type User {
  id: ID!
  name: String!
  Posts: [Post]
}
